<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="WayGo travel app" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>WayGo Travel App</title>

    <!-- Dialogflow Messenger script -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

    <style>
      df-messenger {
        --df-messenger-button-titlebar-color: #2563eb;
        --df-messenger-chat-background-color: #ffffff;
        --df-messenger-font-color: #000000;
        --df-messenger-send-icon: #2563eb;
        --df-messenger-user-message: #e0f2fe;
        --df-messenger-bot-message: #f1f5f9;
        z-index: 9999;
      }
    
      /* Hide the default floating chat icon */
      df-messenger .df-messenger-chat-open-icon {
        display: none !important;
      }
    </style>
    
    
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- The chatbot widget -->
    <df-messenger
      intent="WELCOME"
      chat-title="Waygo Assistant"
      
      language-code="en"
    ></df-messenger>
  </body>
</html>
